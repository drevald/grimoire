plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.helico'
version = '1.0-SNAPSHOT'
description = 'grimoire'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JSP Support (if keeping JSP views)
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'

    // Database
    runtimeOnly 'org.postgresql:postgresql:42.7.2'

    // PDF support
    implementation 'org.apache.pdfbox:pdfbox:3.0.0'

    // JSON
    implementation 'org.json:json:20231013'

    // Commons libraries
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-httpclient:commons-httpclient:3.1'

    // XML Binding (JAXB)
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.4'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Let Spring Boot manage JUnit versions to avoid conflicts
    // Use WireMock 2.x for compatibility with Spring Boot 3.x
    testImplementation 'com.github.tomakehurst:wiremock-jre8:2.35.0'

    // Uncomment if deploying as WAR to external Tomcat
    // providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootWar') {
    archiveFileName = 'grimoire.war'
}

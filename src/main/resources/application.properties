# Server Configuration
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.servlet.context-path=/

# Allow circular references (for legacy code compatibility)
spring.main.allow-circular-references=true

# Allow lazy initialization to break circular dependencies
spring.main.lazy-initialization=true

# Database Configuration
spring.datasource.url=${DATABASE_JNDI}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.open-in-view=false

# JSP Configuration
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Multipart/File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=400MB
spring.servlet.multipart.file-size-threshold=1MB

# Logging Configuration
logging.level.org.springframework=WARN
logging.level.org.helico=INFO
logging.level.org.hibernate=WARN

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Message Source
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Error Pages
server.error.whitelabel.enabled=false


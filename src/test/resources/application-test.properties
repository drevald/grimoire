# Test Profile Configuration
# This profile is used when running integration tests

# Database Configuration (uses same DB as development for real data tests)
spring.datasource.url=${DATABASE_JNDI}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.open-in-view=false

# Logging Configuration (more verbose for tests)
logging.level.org.springframework=INFO
logging.level.org.helico=DEBUG
logging.level.org.hibernate=WARN

# Allow circular references (for legacy code compatibility)
spring.main.allow-circular-references=true

# Allow lazy initialization
spring.main.lazy-initialization=false
